<!DOCTYPE html>
<html>

<head>
  <title>EQUILIBRIVM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>EQUILIBRIVM</h1>
  <p>Uma busca interna para o próprio equilíbrio</p>
  <a href="#" class="botao-zen">INICIAR JORNADA</a>

  <!-- Nova secção que vai aparecer ao fazer scroll -->
  <section class="conteudo-jornada">
    <h2>O Seu Refúgio Digital</h2>
    <p>Deixe o caos lá fora. Este é o seu espaço para focar, respirar e evoluir.</p>

    <!-- Texto que vai receber o mantra sorteado -->
    <p id="mantra-diario" class="mantra"></p>
    <!-- NOVO: Campo de Foco -->
    <input type="text" id="input-foco" class="campo-foco" placeholder="O que deseja libertar hoje?" autocomplete="off">

    <!-- O nosso palco para o exercício de respiração -->
    <div class="circulo-respiracao">
      <p id="texto-respiracao">Pressione para começar</p>
    </div>

    <!-- Seletor de sons ambientes -->
    <div class="seletor-ambiente">
      <button class="btn-som" data-som="audios/ondas.mp3">Ondas</button>
      <button class="btn-som" data-som="audios/chuva.mp3">Chuva</button>
      <button class="btn-som" data-som="audios/floresta.mp3">Floresta</button>
    </div>
  </section>

  <section class="rodape">
    <p>Desenvolvido por Kord</p>
  </section>

  <script src="script.js"></script>
</body>

</html>
